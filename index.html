<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>天坛文创 WebAR</title>
    <link rel="stylesheet" href="./styles.css?v=walk1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <main class="ar-shell">
      <div class="status" id="status">
        <strong>天坛文创 WebAR</strong>
        <span>请允许摄像头权限，并对准书中的长卷主图。</span>
      </div>

      <a-scene
        mindar-image="imageTargetSrc: ./assets/tiantan-main-target.mind; filterMinCF: 0.00001; filterBeta: 0.0001; warmupTolerance: 10; missTolerance: 18"
        color-space="sRGB"
        renderer="alpha: true; antialias: true; colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded>
        <a-assets>
          <img id="targetImage" src="./assets/tiantan-main-target-light.jpg" alt="" />
          <img id="standeesImage" src="./assets/tiantan-standees-upright-clean.png" alt="" />
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
          <a-entity
            id="popStage"
            position="0 -0.03 0.045"
            rotation="0 0 0"
            scale="0.001 0.001 0.001"
            animation__rise="property: scale; to: 1 1 1; dur: 420; easing: easeOutQuad; startEvents: targetFound"
            animation__hide="property: scale; to: 0.001 0.001 0.001; dur: 260; easing: easeInQuad; startEvents: targetLost">
            <a-plane
              width="1.18"
              height="0.56"
              position="-0.42 0 0"
              material="shader: flat; src: #standeesImage; transparent: true; alphaTest: 0.45; depthWrite: false; side: double"
              animation__walk="property: position; dir: alternate; dur: 3600; easing: linear; loop: true; to: 0.42 0 0">
            </a-plane>
          </a-entity>
        </a-entity>
      </a-scene>
    </main>

    <script src="./script.js?v=walk1"></script>
  </body>
</html>

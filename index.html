<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>天坛文创 WebAR</title>
    <link rel="stylesheet" href="./styles.css?v=anchor2" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <main class="ar-shell">
      <div class="status" id="status">
        <strong>天坛文创 WebAR</strong>
        <span>请允许摄像头权限，并对准书中的长卷主图。</span>
      </div>

      <a-scene
        mindar-image="imageTargetSrc: ./assets/tiantan-main-target.mind; filterMinCF: 0.0001; filterBeta: 0.001"
        color-space="sRGB"
        renderer="alpha: true; antialias: true; colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded>
        <a-assets>
          <img id="targetImage" src="./assets/tiantan-main-target-light.jpg" alt="" />
          <img id="standeesImage" src="./assets/tiantan-standees-upright.webp" alt="" />
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
          <a-entity
            id="popStage"
            position="0 -0.04 0.012"
            rotation="-90 0 0"
            scale="0.001 0.001 0.001"
            animation__rise="property: scale; to: 0.28 0.28 0.28; dur: 950; easing: easeOutBack; startEvents: targetFound"
            animation__hide="property: scale; to: 0.001 0.001 0.001; dur: 260; easing: easeInQuad; startEvents: targetLost">
            <a-plane
              src="#standeesImage"
              width="2.35"
              height="1.29"
              position="0 0.645 0"
              material="transparent: true; alphaTest: 0.03; side: double"
              animation__float="property: position; dir: alternate; dur: 2200; easing: easeInOutSine; loop: true; to: 0 0.68 0">
            </a-plane>
          </a-entity>
          <a-plane
            width="0.66"
            height="0.025"
            position="0 -0.04 0.004"
            material="color: #10131b; transparent: true; opacity: 0.35; side: double">
          </a-plane>
        </a-entity>
      </a-scene>
    </main>

    <script src="./script.js?v=anchor2"></script>
  </body>
</html>
